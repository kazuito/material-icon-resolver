name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0
    outputs:
      should-release: ${{ steps.release-tag.outputs.should-release }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check release tag
        id: release-tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping non-release tag: $GITHUB_REF_NAME"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package version matches tag
        if: steps.release-tag.outputs.should-release == 'true'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

  release:
    name: Publish to npm and create GitHub release
    needs: validate-tag
    if: needs.validate-tag.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate icon inventory
        run: pnpm validate-icons

      - name: Verify npm package contents
        run: pnpm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
