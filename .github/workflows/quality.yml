name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    strategy:
      matrix:
        # 18 is the package's minimum supported version (engines.node); 24 is
        # what release.yml builds/publishes with.
        node-version: [18, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate icon inventory
        run: pnpm validate-icons

      - name: Verify npm package contents
        run: pnpm pack --dry-run

  quality-website:
    name: Quality (website)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (website)
        run: pnpm --filter website lint

      - name: Typecheck (website)
        run: pnpm --filter website typecheck

      - name: Build (website)
        run: pnpm --filter website build
