<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>material-icon-resolver / check</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300..700&family=Geist:wght@400;500;600&display=swap"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				color-scheme: dark;
				--bg: #0a0a0c;
				--bg-1: #111114;
				--bg-2: #17171c;
				--bg-3: #1f1f26;
				--fg: #ededf0;
				--fg-2: #9ea0a8;
				--fg-3: #5a5c66;
				--fg-4: #3a3c44;
				--rule: #1d1d22;
				--rule-2: #26262d;
				--accent: #a3e635;
				--accent-dim: #6a9419;
				--accent-soft: rgba(163, 230, 53, 0.08);
				--warn: #fb923c;
				--danger: #f87171;
			}

			html,
			body {
				background: var(--bg);
				color: var(--fg);
				font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
				font-size: 13px;
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			body {
				min-height: 100vh;
			}

			.mono {
				font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
				font-feature-settings: "ss01", "ss02", "ss03";
			}

			.app {
				max-width: 1080px;
				margin: 0 auto;
				padding: 28px 24px 80px;
			}

			/* ─── Header ─────────────────────────────── */
			.head {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 24px;
				padding-bottom: 14px;
				border-bottom: 1px solid var(--rule);
				margin-bottom: 18px;
			}

			.head .title {
				display: flex;
				align-items: baseline;
				gap: 10px;
			}

			.head .dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 0 3px var(--accent-soft);
				display: inline-block;
				transform: translateY(-1px);
			}

			.head h1 {
				font-family: "Geist Mono", monospace;
				font-size: 13px;
				font-weight: 500;
				color: var(--fg);
				letter-spacing: -0.01em;
			}

			.head .desc {
				color: var(--fg-3);
				font-size: 12px;
			}

			.head .meta {
				display: flex;
				gap: 14px;
				font-family: "Geist Mono", monospace;
				font-size: 11px;
				color: var(--fg-3);
			}

			.head .meta .v {
				color: var(--fg-2);
			}

			/* ─── Toolbar ────────────────────────────── */
			.bar {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 16px;
				align-items: center;
				padding: 10px 0;
				border-bottom: 1px solid var(--rule);
				margin-bottom: 16px;
			}

			.field {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				font-size: 11px;
				color: var(--fg-3);
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}

			.field-label {
				font-family: "Geist Mono", monospace;
			}

			.seg {
				display: inline-flex;
				background: var(--bg-1);
				border: 1px solid var(--rule-2);
				border-radius: 6px;
				padding: 2px;
			}

			.seg button {
				background: transparent;
				border: 0;
				color: var(--fg-2);
				font-family: "Geist Mono", monospace;
				font-size: 11px;
				padding: 3px 9px;
				border-radius: 4px;
				cursor: pointer;
				text-transform: lowercase;
				letter-spacing: 0;
			}

			.seg button.on {
				background: var(--bg-3);
				color: var(--fg);
			}

			.seg button:hover:not(.on) {
				color: var(--fg);
			}

			.toggle {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				background: var(--bg-1);
				border: 1px solid var(--rule-2);
				border-radius: 6px;
				padding: 4px 10px;
				font-family: "Geist Mono", monospace;
				font-size: 11px;
				color: var(--fg-2);
				cursor: pointer;
			}

			.toggle .led {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--fg-4);
				transition: background 0.15s;
			}

			.toggle.on {
				color: var(--fg);
				border-color: var(--accent-dim);
			}

			.toggle.on .led {
				background: var(--accent);
				box-shadow: 0 0 6px var(--accent);
			}

			input[type="text"].ver {
				background: var(--bg-1);
				border: 1px solid var(--rule-2);
				border-radius: 6px;
				color: var(--fg);
				font-family: "Geist Mono", monospace;
				font-size: 11px;
				padding: 4px 8px;
				width: 90px;
				outline: none;
			}

			input[type="text"].ver:focus {
				border-color: var(--accent-dim);
			}

			input[type="text"].ver::placeholder {
				color: var(--fg-4);
			}

			.bar .grow {
				flex: 1;
			}

			/* ─── Input area ─────────────────────────── */
			.input {
				margin-bottom: 18px;
			}

			.input-head {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 6px;
			}

			.input-label {
				font-family: "Geist Mono", monospace;
				font-size: 10px;
				letter-spacing: 0.12em;
				color: var(--fg-3);
				text-transform: uppercase;
			}

			.input-label .hint {
				color: var(--fg-4);
				text-transform: none;
				letter-spacing: 0;
				margin-left: 8px;
				font-size: 11px;
			}

			.input-label .hint code {
				color: var(--accent);
				background: var(--accent-soft);
				padding: 0 4px;
				border-radius: 3px;
			}

			.presets {
				display: flex;
				gap: 6px;
				font-family: "Geist Mono", monospace;
				font-size: 11px;
			}

			.presets button {
				background: transparent;
				border: 1px solid var(--rule-2);
				color: var(--fg-2);
				border-radius: 4px;
				padding: 2px 8px;
				cursor: pointer;
				transition: all 0.15s;
			}

			.presets button:hover {
				color: var(--accent);
				border-color: var(--accent-dim);
			}

			textarea {
				width: 100%;
				background: var(--bg-1);
				border: 1px solid var(--rule-2);
				border-radius: 8px;
				color: var(--fg);
				font-family: "Geist Mono", monospace;
				font-size: 12.5px;
				line-height: 1.7;
				padding: 12px 14px;
				resize: vertical;
				min-height: 160px;
				outline: none;
				caret-color: var(--accent);
			}

			textarea:focus {
				border-color: var(--accent-dim);
			}

			textarea::placeholder {
				color: var(--fg-4);
			}

			/* ─── Stats ──────────────────────────────── */
			.stats {
				display: flex;
				margin-bottom: 8px;
				font-family: "Geist Mono", monospace;
				font-size: 11px;
				border-top: 1px solid var(--rule);
				border-bottom: 1px solid var(--rule);
				padding: 10px 0;
				gap: 28px;
				flex-wrap: wrap;
			}

			.stats .s {
				display: inline-flex;
				gap: 6px;
				align-items: baseline;
			}

			.stats .s .k {
				color: var(--fg-3);
				text-transform: uppercase;
				letter-spacing: 0.08em;
				font-size: 10px;
			}

			.stats .s .v {
				color: var(--fg);
				font-weight: 500;
			}

			.stats .s.matched .v {
				color: var(--accent);
			}

			.stats .s.fallback .v {
				color: var(--warn);
			}

			.stats .s.null .v {
				color: var(--danger);
			}

			/* ─── Rows ───────────────────────────────── */
			.list {
				display: flex;
				flex-direction: column;
			}

			.row {
				display: grid;
				grid-template-columns: 32px minmax(0, 1fr) auto auto auto;
				gap: 14px;
				align-items: center;
				padding: 7px 8px;
				border-radius: 6px;
				border: 1px solid transparent;
				font-size: 12.5px;
				transition: background 0.15s, border-color 0.15s;
			}

			.row + .row {
				margin-top: 1px;
			}

			.row:hover {
				background: var(--bg-1);
				border-color: var(--rule-2);
			}

			.row-icon {
				width: 28px;
				height: 28px;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--bg-1);
				border-radius: 5px;
			}

			.row:hover .row-icon {
				background: var(--bg-2);
			}

			.row-icon img {
				width: 22px;
				height: 22px;
				display: block;
			}

			.row-icon.is-default {
				background: transparent;
				border: 1px dashed var(--fg-4);
			}

			.row-path {
				font-family: "Geist Mono", monospace;
				color: var(--fg-2);
				font-size: 12.5px;
				word-break: break-all;
				min-width: 0;
				display: flex;
				align-items: baseline;
				gap: 10px;
				flex-wrap: wrap;
			}

			.row-path .p {
				color: var(--fg);
			}

			.row-path .sep {
				color: var(--fg-3);
			}

			.row-path .trail {
				color: var(--accent);
			}

			.row-path .arrow {
				color: var(--fg-4);
				font-size: 11px;
			}

			.row-path .name {
				color: var(--accent);
				font-weight: 500;
			}

			.row-path .name.null {
				color: var(--danger);
				font-weight: 400;
			}

			.row-path .name.is-default {
				color: var(--warn);
			}

			.row-tag {
				font-family: "Geist Mono", monospace;
				font-size: 9.5px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--fg-3);
				border: 1px solid var(--rule-2);
				border-radius: 999px;
				padding: 2px 8px;
				white-space: nowrap;
			}

			.row-tag.is-fileNamesWithPath,
			.row-tag.is-rootFolderNames {
				color: var(--accent);
				border-color: var(--accent-dim);
			}

			.row-tag.is-fileNames,
			.row-tag.is-folderNames,
			.row-tag.is-fileExtensions {
				color: var(--fg-2);
				border-color: var(--rule-2);
			}

			.row-tag.is-default {
				color: var(--warn);
				border-color: rgba(251, 146, 60, 0.3);
			}

			.row-tag.is-null {
				color: var(--danger);
				border-color: rgba(248, 113, 113, 0.3);
			}

			.row-type {
				font-family: "Geist Mono", monospace;
				font-size: 10px;
				color: var(--fg-3);
				white-space: nowrap;
			}

			.row-link {
				color: var(--fg-4);
				font-size: 13px;
				text-decoration: none;
				width: 24px;
				height: 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 4px;
				transition: color 0.15s, background 0.15s;
			}

			.row-link:hover {
				color: var(--accent);
				background: var(--accent-soft);
			}

			.empty {
				padding: 56px 16px;
				text-align: center;
				color: var(--fg-3);
				font-family: "Geist Mono", monospace;
				font-size: 12px;
			}

			/* ─── Footer ─────────────────────────────── */
			.foot {
				margin-top: 32px;
				padding-top: 14px;
				border-top: 1px solid var(--rule);
				font-family: "Geist Mono", monospace;
				font-size: 10px;
				color: var(--fg-4);
				letter-spacing: 0.04em;
				display: flex;
				justify-content: space-between;
			}

			/* ─── Compact responsive ─────────────────── */
			@media (max-width: 720px) {
				.app {
					padding: 20px 14px 60px;
				}
				.head {
					flex-direction: column;
					align-items: flex-start;
					gap: 8px;
				}
				.row {
					grid-template-columns: 28px minmax(0, 1fr) auto;
					gap: 10px;
				}
				.row-type {
					display: none;
				}
				.row-link {
					grid-row: 1;
					grid-column: 3;
				}
				.row-tag {
					grid-row: 2;
					grid-column: 2 / -1;
					justify-self: start;
				}
			}
		</style>
	</head>
	<body>
		<div class="app" id="app"></div>

		<script type="importmap">
			{
				"imports": {
					"vue": "https://esm.sh/vue@3.5.13/dist/vue.esm-browser.prod.js",
					"material-icon-resolver": "./dist/index.mjs"
				}
			}
		</script>

		<script type="module">
			import { createApp, ref, computed } from "vue";
			import { resolveMaterialIcon, metadata } from "material-icon-resolver";

			const DEFAULT_PATHS = [
				".claude/settings.json",
				".claude/statusline.sh",
				".codex/config.toml",
				".config/eza/theme.yml",
				".config/gh/config.yml",
				".config/ghostty/config",
				"src/index.ts",
				"src/App.vue",
				"src/",
				"node_modules/",
				".github/",
				".github/workflows/ci.yml",
				"package.json",
				"Dockerfile",
				"Cargo.toml",
				"Makefile",
				"README.md",
				".env.local",
			].join("\n");

			const PRESETS = [
				{
					label: "files",
					paths: [
						"index.ts", "index.js", "page.tsx", "style.css",
						"config.yml", "Dockerfile", "Makefile", "Cargo.toml",
						".gitignore", "package.json", "README.md", "main.go",
						"main.rs", "main.py", "app.rb", ".env",
					],
				},
				{
					label: "folders",
					paths: [
						"src/", "node_modules/", ".github/", "public/",
						"test/", "docs/", "dist/", ".vscode/",
					],
				},
				{
					label: "yaml",
					paths: [
						"config.yml", "compose.yaml", "docker-compose.yml",
						".github/workflows/ci.yml", "helm/values.yaml",
					],
				},
				{
					label: "edge",
					paths: [
						".config/ghostty/config", "some-binary",
						"weird.unknown.ext", "src/lib.d.ts",
						"page.test.tsx", ".github/FUNDING.yml",
					],
				},
			];

			const App = {
				template: `
					<header class="head">
						<div class="title">
							<span class="dot"></span>
							<h1>material-icon-resolver</h1>
							<span class="desc">manual icon resolver check</span>
						</div>
						<div class="meta">
							<span>upstream <span class="v">{{ metadataVersion }}</span></span>
							<span>{{ stats.total }} entries</span>
						</div>
					</header>

					<div class="bar">
						<div class="field">
							<span class="field-label">cdn</span>
							<div class="seg">
								<button :class="{ on: cdn === 'jsdelivr' }" @click="cdn = 'jsdelivr'">jsdelivr</button>
								<button :class="{ on: cdn === 'unpkg' }" @click="cdn = 'unpkg'">unpkg</button>
							</div>
						</div>
						<div class="field">
							<span class="field-label">fallback</span>
							<div class="seg">
								<button :class="{ on: fallback === 'match' }" @click="fallback = 'match'">match</button>
								<button :class="{ on: fallback === 'file' }" @click="fallback = 'file'">file</button>
								<button :class="{ on: fallback === 'folder' }" @click="fallback = 'folder'">folder</button>
								<button :class="{ on: fallback === 'none' }" @click="fallback = 'none'">none</button>
							</div>
						</div>
						<div class="field">
							<span class="field-label">version</span>
							<input type="text" class="ver" v-model="version" :placeholder="metadataVersion" spellcheck="false" />
						</div>
						<button class="toggle" :class="{ on: open }" @click="open = !open" type="button">
							<span class="led"></span>
							<span>folder · open</span>
						</button>
					</div>

					<section class="input">
						<div class="input-head">
							<div class="input-label">
								paths
								<span class="hint">trailing <code>/</code> = folder</span>
							</div>
							<div class="presets">
								<button v-for="p in presets" :key="p.label" @click="applyPreset(p)" type="button">{{ p.label }}</button>
								<button @click="paths = ''" type="button">clear</button>
								<button @click="paths = defaultPaths" type="button">reset</button>
							</div>
						</div>
						<textarea
							v-model="paths"
							spellcheck="false"
							placeholder="one path per line — append / for folders"
						></textarea>
					</section>

					<div class="stats">
						<span class="s"><span class="k">total</span><span class="v">{{ stats.total }}</span></span>
						<span class="s matched"><span class="k">matched</span><span class="v">{{ stats.resolved }}</span></span>
						<span class="s fallback"><span class="k">fallback</span><span class="v">{{ stats.defaulted }}</span></span>
						<span class="s null"><span class="k">null</span><span class="v">{{ stats.nulled }}</span></span>
						<span class="s"><span class="k">files</span><span class="v">{{ stats.files }}</span></span>
						<span class="s"><span class="k">folders</span><span class="v">{{ stats.folders }}</span></span>
					</div>

					<div class="list">
						<div
							v-for="(item, i) in items"
							:key="i"
							class="row"
						>
							<div
								class="row-icon"
								:class="{ 'is-default': item.result && item.result.source === 'default' }"
							>
								<img
									v-if="item.result"
									:src="item.result.cdnUrl"
									:alt="item.result.name"
									loading="lazy"
								/>
							</div>
							<div class="row-path">
								<span>
									<template v-for="(seg, j) in pathSegments(item.raw)" :key="j">
										<span :class="seg.cls">{{ seg.text }}</span>
									</template>
								</span>
								<span class="arrow">→</span>
								<span
									v-if="item.result"
									:class="['name', item.result.source === 'default' ? 'is-default' : '']"
								>{{ item.result.name }}</span>
								<span v-else class="name null">null</span>
							</div>
							<span
								v-if="item.result"
								:class="['row-tag', 'is-' + item.result.source]"
							>{{ item.result.source }}</span>
							<span v-else class="row-tag is-null">null</span>
							<span class="row-type">{{ item.type }}{{ item.type === 'folder' && open ? ' · open' : '' }}</span>
							<a
								v-if="item.result"
								:href="item.result.cdnUrl"
								target="_blank"
								rel="noreferrer"
								class="row-link"
								:title="item.result.cdnUrl"
							>↗</a>
							<span v-else class="row-link" style="visibility:hidden">↗</span>
						</div>
						<div v-if="items.length === 0" class="empty">
							no paths — paste some above
						</div>
					</div>

					<footer class="foot">
						<span>material-icon-resolver · check.html</span>
						<span>{{ stats.resolved }}/{{ stats.total }} resolved</span>
					</footer>
				`,
				setup() {
					const paths = ref(DEFAULT_PATHS);
					const fallback = ref("match");
					const cdn = ref("jsdelivr");
					const open = ref(false);
					const version = ref("");

					const metadataVersion = metadata.upstreamVersion;
					const defaultPaths = DEFAULT_PATHS;
					const presets = PRESETS;

					function applyPreset(p) {
						paths.value = p.paths.join("\n");
					}

					function pathSegments(raw) {
						const isFolder = raw.endsWith("/");
						const body = isFolder ? raw.slice(0, -1) : raw;
						const out = [];
						const parts = body.split("/");
						parts.forEach((part, i) => {
							if (i > 0) out.push({ text: "/", cls: "sep" });
							out.push({ text: part, cls: "p" });
						});
						if (isFolder) out.push({ text: "/", cls: "trail" });
						return out;
					}

					const items = computed(() => {
						const lines = paths.value
							.split("\n")
							.map((s) => s.trim())
							.filter(Boolean);
						return lines.map((raw) => {
							const isFolder = raw.endsWith("/");
							const cleanPath = isFolder ? raw.slice(0, -1) : raw;
							const type = isFolder ? "folder" : "file";
							const fb = fallback.value === "match" ? type : fallback.value;
							if (!cleanPath) {
								return { raw, type, result: null };
							}
							const opts = {
								type,
								cdn: cdn.value,
								fallback: fb,
								open: open.value,
							};
							if (version.value) opts.version = version.value;
							const result = resolveMaterialIcon(cleanPath, opts);
							return { raw, type, result };
						});
					});

					const stats = computed(() => {
						const total = items.value.length;
						let resolved = 0, defaulted = 0, nulled = 0, files = 0, folders = 0;
						for (const it of items.value) {
							if (it.type === "file") files++;
							else folders++;
							if (it.result === null) nulled++;
							else if (it.result.source === "default") defaulted++;
							else resolved++;
						}
						return { total, resolved, defaulted, nulled, files, folders };
					});

					return {
						paths, fallback, cdn, open, version,
						metadataVersion, defaultPaths, presets,
						items, stats, applyPreset, pathSegments,
					};
				},
			};

			createApp(App).mount("#app");
		</script>
	</body>
</html>
